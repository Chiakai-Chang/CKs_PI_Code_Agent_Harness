name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax (setup.py / restore.py / uninstall.py)
        run: |
          python -m py_compile scripts/setup.py
          python -m py_compile scripts/restore.py
          python -m py_compile scripts/uninstall.py
          python -m py_compile scripts/report-task-shapes.py

      - name: Run tests (unittest, zero-dependency)
        run: |
          python -m unittest discover -s tests -v

      - name: Audit cross-bridge prompt conflicts
        run: |
          python scripts/check-prompt-conflicts.py

      - name: Verify bridge health
        run: |
          python scripts/verify-bridges.py

      - name: Validate pi-config
        run: |
          python scripts/validate-config.py

      # Swapping a bridge, a config or the prompt each had a check; swapping the
      # MODEL had a markdown file somebody had to remember to read, and on
      # 2026-08-13 nobody did — a 6.5-hour session in which every file the model
      # wrote ended in `</atem:日>`, because the served chat template taught a
      # tool-call dialect Pi does not use. There is no model server on a runner,
      # so this prints SKIP and exits 0 here; it earns its keep on the machine
      # that serves the model. It is in CI so the SCRIPT stays runnable — a
      # check nobody executes rots exactly like the checklist it replaces.
      - name: Check what the model server actually loaded
        run: |
          python scripts/check-model-serving.py

      # Every external source stays accounted for: README's list, the manifest
      # and the clones on disk must all appear in the prior-art register. A day
      # was spent rebuilding mechanisms a registered clone already implements.
      - name: Check the prior-art register
        run: |
          python scripts/check-prior-art.py

      # Mutate the guards and require the tests to notice. Four defects of one
      # class are on record and every one was a check that could not fail, so
      # "the tests are green" needed something behind it.
      #
      # Sampled at 4 sites per module, measured at 79s across ten modules — an
      # exhaustive sweep is minutes and belongs in a local run. A green here is
      # therefore not proof of coverage; it is proof that these sites are held,
      # and it moves as the files move. Survivors must be argued in
      # scripts/guard-mutation-allowlist.json or this fails.
      - name: Mutate the guards
        run: |
          python scripts/check-guard-mutations.py --cap 4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: shellcheck restore.sh
        run: |
          shellcheck scripts/restore.sh

      - name: shellcheck the live check scripts
        run: |
          shellcheck --severity=warning \
            pi-extensions/async-exec-bridge/live-preflight.sh \
            pi-extensions/async-exec-bridge/e2e-check.sh \
            pi-extensions/async-exec-bridge/lifecycle-check.sh

      # These need pi, an installed bridge and a model server, none of which a
      # hosted runner has, so here they SKIP. That is not a free pass: the skip
      # path itself is exercised by tests/test_live_checks.py above, which runs
      # both scripts against a closed port and asserts they say why they
      # skipped and that ASYNC_EXEC_REQUIRE_LIVE=1 makes skipping impossible.
      # On a self-hosted runner with a model, set ASYNC_EXEC_REQUIRE_LIVE=1 and
      # these become the real end-to-end gate.
      - name: Live checks (skip without a model server)
        run: |
          for check in e2e-check lifecycle-check; do
            out="$(bash pi-extensions/async-exec-bridge/$check.sh)" || {
              echo "$out"
              echo "::error::$check failed"
              exit 1
            }
            echo "$out"
            case "$out" in
              SKIP:*) echo "::notice::$check skipped — ${out#SKIP: }" ;;
              *) echo "::notice::$check ran live and passed" ;;
            esac
          done

      - name: Validate JSON files
        run: |
          python -c "
          import json, sys, pathlib
          base = pathlib.Path('.').resolve()
          errors = []
          for p in list(base.glob('pi-config/**/*.json')) + list(base.glob('*.json')):
              if not p.is_file():
                  continue
              try:
                  json.loads(p.read_text())
              except Exception as e:
                  errors.append(f'{p}: {e}')
          if errors:
              print('JSON validation errors:')
              for m in errors:
                  print(m)
              sys.exit(1)
          print('All JSON files are valid.')
          "
